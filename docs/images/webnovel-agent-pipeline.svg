<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F3E6"/>
      <stop offset="100%" stop-color="#F1E9D6"/>
    </linearGradient>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2C2824" flood-opacity="0.07"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8B5E34"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#paperBg)" stroke="#DED7C6" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-size="13" font-weight="700" letter-spacing="2" fill="#8B5E34">WEB-NOVEL LONG-FORM MEMORY &amp; CO-CREATION ENGINE</text>
  <text x="48" y="80" font-size="25" font-weight="800" fill="#2C2824">专为百万字网文连载设计的「防吃书 · 防剧透 · 去 AI 味」共创流水线</text>
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#E2DAC8" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g filter="url(#softShadow)">
    <rect x="48" y="122" width="248" height="352" rx="14" fill="#FCF9F2" stroke="#D5CCB8" stroke-width="1.5"/>
  </g>
  <circle cx="80" cy="156" r="15" fill="#8B5E34"/>
  <text x="80" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">01</text>
  <text x="104" y="161" font-size="16" font-weight="800" fill="#2C2824">连载资产与记忆底座</text>

  <rect x="66" y="182" width="212" height="62" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="80" y="205" font-size="13" font-weight="700" fill="#2C2824">世界观 · 力量体系 · 主线卷纲</text>
  <text x="80" y="227" font-size="11.5" fill="#655F58">境界战力、势力地图、核心卖点锚定</text>

  <rect x="66" y="256" width="212" height="62" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="80" y="279" font-size="13" font-weight="700" fill="#2C2824">动态人物卡 · 伏笔回收账本</text>
  <text x="80" y="301" font-size="11.5" fill="#655F58">人物口癖、当前伤势/筹码、未回收暗线</text>

  <rect x="66" y="330" width="212" height="62" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="80" y="353" font-size="13" font-weight="700" fill="#2C2824">选区边注 · 章节末状态快照</text>
  <text x="80" y="375" font-size="11.5" fill="#655F58">随手批注灵感，自动追踪前章结尾钩子</text>

  <rect x="66" y="404" width="212" height="52" rx="9" fill="#EFE7D4" stroke="#D5C6A9"/>
  <text x="172" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8B5E34">拆书炼技（技能库 &amp; 素材库）</text>
  <text x="172" y="445" text-anchor="middle" font-size="11" fill="#655F58">把名作节奏与个人文风沉淀为复用资产</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="296" y1="298" x2="328" y2="298" stroke="#8B5E34" stroke-width="2.2" marker-end="url(#flowArrow)"/>

  <!-- Step 2 -->
  <g filter="url(#softShadow)">
    <rect x="332" y="122" width="268" height="352" rx="14" fill="#FCF9F2" stroke="#8B5E34" stroke-width="2"/>
  </g>
  <circle cx="364" cy="156" r="15" fill="#8B5E34"/>
  <text x="364" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">02</text>
  <text x="388" y="161" font-size="16" font-weight="800" fill="#2C2824">限知防剧透取证组装</text>

  <rect x="350" y="182" width="232" height="82" rx="9" fill="#F6EFE0" stroke="#DECBB0"/>
  <text x="364" y="206" font-size="13" font-weight="700" fill="#8B5E34">精准章节意图识别</text>
  <text x="364" y="228" font-size="12" fill="#2C2824">自动判定「续写第 120 章」或</text>
  <text x="364" y="247" font-size="12" fill="#2C2824">「回改第 18 章铺垫」，按需取证</text>

  <rect x="350" y="276" width="232" height="94" rx="9" fill="#F6EFE0" stroke="#DECBB0"/>
  <text x="364" y="300" font-size="13" font-weight="700" fill="#8B5E34">严格时间线视角隔离</text>
  <text x="364" y="322" font-size="12" fill="#2C2824">精修早章时自动屏蔽后续章节真</text>
  <text x="364" y="341" font-size="12" fill="#2C2824">相与未来底牌，根治 AI 上帝视角</text>
  <text x="364" y="358" font-size="11.5" font-weight="600" fill="#40845A">✓ 零未来剧透污染 · 零设定遗忘</text>

  <rect x="350" y="382" width="232" height="74" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="364" y="406" font-size="13" font-weight="700" fill="#2C2824">网文实战技法注入</text>
  <text x="364" y="427" font-size="11.5" fill="#655F58">黄金三章、期待感拉扯、章末断章钩</text>
  <text x="364" y="444" font-size="11.5" fill="#655F58">子、反套路爽点与去 AI 腔约束</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="298" x2="632" y2="298" stroke="#8B5E34" stroke-width="2.2" marker-end="url(#flowArrow)"/>

  <!-- Step 3 -->
  <g filter="url(#softShadow)">
    <rect x="636" y="122" width="244" height="352" rx="14" fill="#FCF9F2" stroke="#D5CCB8" stroke-width="1.5"/>
  </g>
  <circle cx="668" cy="156" r="15" fill="#2F6668"/>
  <text x="668" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">03</text>
  <text x="692" y="161" font-size="16" font-weight="800" fill="#2C2824">三种共创护栏模式</text>

  <rect x="654" y="182" width="208" height="82" rx="9" fill="#EEF3F2" stroke="#C6D6D5"/>
  <text x="668" y="206" font-size="13.5" font-weight="700" fill="#244B4D">卡文脑暴（只读护栏）</text>
  <text x="668" y="228" font-size="12" fill="#526B6C">给 3 套差异化剧情破局走法与</text>
  <text x="668" y="247" font-size="12" fill="#526B6C">代价推演，绝不动你一字正文</text>

  <rect x="654" y="276" width="208" height="82" rx="9" fill="#EEF3F2" stroke="#C6D6D5"/>
  <text x="668" y="300" font-size="13.5" font-weight="700" fill="#244B4D">毒点与节奏审稿（只读）</text>
  <text x="668" y="322" font-size="12" fill="#526B6C">从老白读者视角挑出憋屈点、</text>
  <text x="668" y="341" font-size="12" fill="#526B6C">战力崩坏、逻辑硬伤与水字数</text>

  <rect x="654" y="370" width="208" height="86" rx="9" fill="#EEF3F2" stroke="#C6D6D5"/>
  <text x="668" y="394" font-size="13.5" font-weight="700" fill="#244B4D">选区精修 &amp; 章节起稿</text>
  <text x="668" y="416" font-size="12" fill="#526B6C">划选正文原地打磨动作戏、对</text>
  <text x="668" y="435" font-size="12" fill="#526B6C">白张力与情绪爆发，贴合原笔力</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="880" y1="298" x2="912" y2="298" stroke="#8B5E34" stroke-width="2.2" marker-end="url(#flowArrow)"/>

  <!-- Step 4 -->
  <g filter="url(#softShadow)">
    <rect x="916" y="122" width="236" height="352" rx="14" fill="#FCF9F2" stroke="#D5CCB8" stroke-width="1.5"/>
  </g>
  <circle cx="948" cy="156" r="15" fill="#40845A"/>
  <text x="948" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">04</text>
  <text x="972" y="161" font-size="16" font-weight="800" fill="#2C2824">作家终审与闭环</text>

  <rect x="934" y="182" width="200" height="90" rx="9" fill="#EDF5EF" stroke="#BDD6C5"/>
  <text x="948" y="206" font-size="13.5" font-weight="700" fill="#2B5E3F">Diff 差异提案审阅</text>
  <text x="948" y="228" font-size="12" fill="#425C4B">红绿对照清晰展示每一处改</text>
  <text x="948" y="247" font-size="12" fill="#425C4B">动，接受 / 拒绝全由作者说了算</text>

  <rect x="934" y="284" width="200" height="84" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="948" y="308" font-size="13.5" font-weight="700" fill="#2C2824">一键收进设定卡片</text>
  <text x="948" y="330" font-size="12" fill="#655F58">正文中新登场的人物/法宝/伏</text>
  <text x="948" y="349" font-size="12" fill="#655F58">笔，顺手沉淀回设定与记忆库</text>

  <rect x="934" y="380" width="200" height="76" rx="9" fill="#F4EFE2" stroke="#E0D8C5"/>
  <text x="948" y="404" font-size="13.5" font-weight="700" fill="#2C2824">断点记忆「继续写」</text>
  <text x="948" y="426" font-size="12" fill="#655F58">查阅百章前伏笔后一键跳回光</text>
  <text x="948" y="445" font-size="12" fill="#655F58">标原位，日更万字不断档</text>
</svg>
